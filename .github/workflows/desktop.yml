name: Desktop

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/desktop.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the installers for (leave empty to release main)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      previous: ${{ steps.pick.outputs.previous }}
      ref: ${{ steps.pick.outputs.ref }}
      existing: ${{ steps.pick.outputs.existing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: pick the version and the commit to build
        id: pick
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -n "$tag" ]; then
            git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || { echo "::error::no tag $tag"; exit 1; }
            version="${tag#[vV]}"
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$tag^" 2>/dev/null || true)
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
            if [ -z "$previous" ]; then
              version=$(jq -r .version packages/apps/desktop/package.json)
            else
              IFS=. read -r major minor patch <<< "${previous#v}"
              if git log --format=%s "$previous..HEAD" | grep -qE '^feat(\([^)]*\))?:'; then
                version="$major.$((minor + 1)).0"
              else
                version="$major.$minor.$((patch + 1))"
              fi
            fi
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}

  check:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: install — frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test, Docker included
        run: pnpm test

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    defaults:
      run:
        shell: bash
        working-directory: packages/apps/desktop

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: install — frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: keep Electron and the packaging tools between runs
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: package
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_PASSWORD" APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          for wait in 30 60 120 0; do
            pnpm dist --publish never -c.extraMetadata.version="$VERSION" && exit 0
            [ "$wait" = 0 ] && break
            echo "::warning::packaging failed, retrying in $wait s"
            sleep "$wait"
          done
          exit 1
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/apps/desktop/release/*.dmg
            packages/apps/desktop/release/*.exe
            packages/apps/desktop/release/*.AppImage
            packages/apps/desktop/release/*.deb

  publish:
    if: github.event_name != 'pull_request' && (needs.version.outputs.existing == 'true' || github.ref == 'refs/heads/main')
    needs: [version, check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: write the release notes
        run: |
          if [ -n "$PREVIOUS" ]; then
            git log --format='- %s' "$PREVIOUS..HEAD" > notes.md
          else
            echo "First release of LAMMPS Studio." > notes.md
          fi
        env:
          PREVIOUS: ${{ needs.version.outputs.previous }}

      - name: publish the release with the installers
        run: |
          tag="v$VERSION"
          if [ "$EXISTING" = true ]; then
            tag=$(git describe --tags --exact-match HEAD --match "[vV]$VERSION")
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
            if [ -z "$(gh release view "$tag" --json body -q .body)" ]; then
              gh release edit "$tag" --notes-file notes.md
            fi
          else
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "LAMMPS Studio $VERSION" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          EXISTING: ${{ needs.version.outputs.existing }}
