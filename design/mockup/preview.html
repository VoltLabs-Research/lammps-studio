<div class="mockbar" role="region" aria-label="Mockup controls">
    <span class="mockbar__tag">Mockup</span>
    <div class="mockbar__group">
        <span>View</span>
        <div class="seg sm" id="mock-view">
            <button type="button" data-view="simulations" aria-pressed="true">Dashboard</button>
            <button type="button" data-view="workspace" aria-pressed="false">Simulation</button>
        </div>
    </div>
    <div class="mockbar__group">
        <span>Run state</span>
        <div class="seg sm" id="mock-state">
            <button type="button" data-state="idle" aria-pressed="false">Not run</button>
            <button type="button" data-state="building" aria-pressed="false">Building</button>
            <button type="button" data-state="running" aria-pressed="true">Running</button>
            <button type="button" data-state="stopping" aria-pressed="false">Stopping</button>
            <button type="button" data-state="finished" aria-pressed="false">Finished</button>
            <button type="button" data-state="failed" aria-pressed="false">Failed</button>
            <button type="button" data-state="noscript" aria-pressed="false">No script</button>
        </div>
    </div>
    <div class="mockbar__group">
        <span>Theme</span>
        <div class="seg sm" id="mock-theme">
            <button type="button" data-theme-opt="system" aria-pressed="true">System</button>
            <button type="button" data-theme-opt="light" aria-pressed="false">Light</button>
            <button type="button" data-theme-opt="dark" aria-pressed="false">Dark</button>
        </div>
    </div>
    <div class="mockbar__group">
        <span>Cards</span>
        <div class="seg sm" id="mock-cards">
            <button type="button" data-cards="text" aria-pressed="false">1 · Text</button>
            <button type="button" data-cards="image" aria-pressed="true">2 · Text + image</button>
            <button type="button" data-cards="sections" aria-pressed="false">3 · Sections</button>
        </div>
    </div>
    <span class="mockbar__hint">Sample data · only “Cu nanowire tension” and “Water box” open</span>
</div>

<div class="window" id="window">

    <!-- ================= Dashboard ================= -->
    <div class="view" id="view-dashboard">
        <div class="page-frame">
            <div class="page-surface">
                <header class="dash-header">
                    <span aria-hidden="true"></span>
                    <button type="button" class="search" data-open="palette"><svg class="icon sm"><use href="#i-search"/></svg><span>Search simulations, scripts and machines</span><span class="kbd">Ctrl K</span></button>
                    <div class="dash-header__right">
                        <button type="button" class="icon-btn" data-open="settings" data-tip="Settings" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
                        <span class="traffic" aria-hidden="true"><span></span><span></span><span></span></span>
                    </div>
                </header>
                <div class="page-scroll">
                    <div class="page" id="page-simulations"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= Workspace ================= -->
    <div class="view" id="view-workspace" hidden>
        <div class="ws">
            <header class="ws-top">
                <div class="ws-top__left">
                    <button type="button" class="icon-btn" id="ws-back" data-tip="Back to simulations" aria-label="Back to simulations"><svg class="icon sm"><use href="#i-chev-left"/></svg></button>
                    <span class="ws-title" id="ws-title">Cu nanowire tension</span>
                    <button type="button" class="machine-chip" data-act-open="config" data-tip="Where this simulation runs"><span id="ws-machine">This computer</span><svg class="icon xs"><use href="#i-chev-down"/></svg></button>
                </div>
                <div class="ws-top__center">
                    <button type="button" class="run-chip" id="run-pill" data-act-jump="output" data-tip="Show output" hidden></button>
                </div>
                <div class="ws-top__right">
                    <button type="button" class="config-chip" data-act-open="config" data-tip="Build and run settings"><svg class="icon sm"><use href="#i-cpu"/></svg><span id="config-chip-text">8 MPI × 2 OpenMP · MANYBODY OPENMP</span></button>
                    <div class="btn-split" id="run-btn-wrap"></div>
                    <span class="traffic" aria-hidden="true"><span></span><span></span><span></span></span>
                </div>
            </header>

            <div class="ws-body" id="ws-body">
                <nav class="activity" aria-label="Panels">
                    <button type="button" class="act" data-act="editor" aria-pressed="true" data-tip="Editor · VS Code" data-tip-side="right" aria-label="Editor"><svg class="icon lg"><use href="#i-files"/></svg></button>
                    <button type="button" class="act" data-act="output" aria-pressed="false" data-tip="Output · Ctrl+Shift+L" data-tip-side="right" aria-label="Output"><svg class="icon lg"><use href="#i-terminal"/></svg><span class="act__badge warn" id="badge-output" hidden>2</span></button>
                    <button type="button" class="act" data-act="charts" aria-pressed="false" data-tip="Charts · Ctrl+Shift+C" data-tip-side="right" aria-label="Charts"><svg class="icon lg"><use href="#i-chart"/></svg></button>
                    <button type="button" class="act" data-act="variables" aria-pressed="false" data-tip="Variables, computes and fixes" data-tip-side="right" aria-label="Variables"><svg class="icon lg"><use href="#i-braces"/></svg></button>
                    <button type="button" class="act" data-act="outputs" aria-pressed="false" data-tip="Files" data-tip-side="right" aria-label="Files"><svg class="icon lg"><use href="#i-folder"/></svg><span class="act__badge" id="badge-files">93</span></button>
                    <button type="button" class="act" data-act="runs" aria-pressed="false" data-tip="Runs" data-tip-side="right" aria-label="Runs"><svg class="icon lg"><use href="#i-history"/></svg></button>
                    <button type="button" class="act" data-act="config" aria-pressed="false" data-tip="Build and run settings" data-tip-side="right" aria-label="Build and run settings"><svg class="icon lg"><use href="#i-package"/></svg></button>
                    <span class="activity__spacer"></span>
                    <button type="button" class="act" data-open="settings" data-tip="Settings" data-tip-side="right" aria-label="Settings"><svg class="icon lg"><use href="#i-settings"/></svg><span class="act__badge">1</span></button>
                </nav>

                <section class="panel" id="panel" aria-label="Panel">
                    <div class="panel__head" id="panel-head"></div>
                    <div class="panel__body" id="panel-body"></div>
                </section>

                <div class="resize" id="resize" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"></div>

                <section class="viewport" id="viewport" aria-label="Last computed timestep">
                    <div class="banner" id="banner" role="alert" hidden></div>
                    <div class="vp-stage" id="vp-stage">
                        <canvas id="gl"></canvas>
                        <div class="vp-rail glass" id="vp-rail">
                            <button type="button" class="icon-btn" id="btn-display" data-tip="Display" data-tip-side="left" aria-label="Display settings"><svg class="icon"><use href="#i-palette"/></svg></button>
                            <button type="button" class="icon-btn" id="btn-box" aria-pressed="true" data-tip="Simulation box" data-tip-side="left" aria-label="Toggle simulation box"><svg class="icon"><use href="#i-box"/></svg></button>
                            <button type="button" class="icon-btn" id="btn-axes" aria-pressed="true" data-tip="Axes" data-tip-side="left" aria-label="Toggle axes"><svg class="icon"><use href="#i-axes"/></svg></button>
                            <button type="button" class="icon-btn" id="btn-reset" data-tip="Reset view · double-click" data-tip-side="left" aria-label="Reset view"><svg class="icon"><use href="#i-scan"/></svg></button>
                            <button type="button" class="icon-btn" id="btn-shot" data-tip="Save image" data-tip-side="left" aria-label="Save image"><svg class="icon"><use href="#i-camera"/></svg></button>
                            <button type="button" class="icon-btn" id="btn-full" data-tip="Hide panel" data-tip-side="left" aria-label="Hide panel"><svg class="icon"><use href="#i-maximize"/></svg></button>
                        </div>
                        <div class="popover glass" id="display-pop" hidden style="right:58px;top:10px;width:280px"></div>
                        <svg class="vp-axes" id="vp-axes" viewBox="-32 -32 64 64" aria-hidden="true"></svg>
                        <div class="vp-overlay" id="vp-overlay" hidden></div>
                    </div>
                    <footer class="vp-bottom" id="vp-bottom">
                        <div class="vp-bottom__info">
                            <div class="vp-info" id="vp-info"></div>
                            <div class="vp-legend" id="vp-legend"></div>
                        </div>
                        <div class="timeline" id="timeline">
                            <button type="button" class="icon-btn sm" id="tl-first" aria-label="First frame" data-tip="First frame" data-tip-side="top"><svg class="icon sm"><use href="#i-skip-back"/></svg></button>
                            <button type="button" class="icon-btn sm" id="tl-prev" aria-label="Previous frame" data-tip="Previous frame" data-tip-side="top"><svg class="icon sm"><use href="#i-chev-left"/></svg></button>
                            <button type="button" class="icon-btn sm" id="tl-play" aria-label="Play frames" data-tip="Play frames" data-tip-side="top"><svg class="icon sm"><use href="#i-play"/></svg></button>
                            <button type="button" class="icon-btn sm" id="tl-next" aria-label="Next frame" data-tip="Next frame" data-tip-side="top"><svg class="icon sm"><use href="#i-chev-right"/></svg></button>
                            <button type="button" class="icon-btn sm" id="tl-last" aria-label="Last frame" data-tip="Last frame" data-tip-side="top"><svg class="icon sm"><use href="#i-skip-fwd"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
<script>
(function () {
    const p = new URLSearchParams(location.search);
    const click = (sel) => { const el = document.querySelector(sel); if (el) el.click(); else console.error('TEST: missing ' + sel); };
    if (p.get('page')) click(`.nav-item[data-page="${p.get('page')}"]`);
    if (p.get('state')) click(`#mock-state [data-state="${p.get('state')}"]`);
    if (p.get('act')) click(`.act[data-act="${p.get('act')}"]`);
    if (p.get('open')) click(`[data-open="${p.get('open')}"]`);
    const seq = (p.get('seq') || '').split('|').filter(Boolean);
    const fire = (sel) => {
        const m = /^(dbl|ctx|key-(\w+)):(.*)$/.exec(sel);
        if (!m) { click(sel); return; }
        const el = document.querySelector(m[3]);
        if (!el) { console.error('TEST: missing ' + m[3]); return; }
        const r = el.getBoundingClientRect();
        const o = { bubbles: true, cancelable: true, clientX: r.left + 40, clientY: r.top + r.height / 2 };
        if (m[1] === 'dbl') el.dispatchEvent(new MouseEvent('dblclick', o));
        else if (m[1] === 'ctx') el.dispatchEvent(new MouseEvent('contextmenu', o));
        else { el.focus(); el.dispatchEvent(new KeyboardEvent('keydown', { key: m[2], bubbles: true })); }
    };
    seq.forEach((sel, i) => setTimeout(() => { console.log('TEST step ' + sel); fire(sel); }, 400 * (i + 1)));
    [1500, 3000, 5000, 8500].forEach((t) => setTimeout(() => { const st = window.__studio; if (!st) return; const V = st.VIEW; const gl = V.renderer && V.renderer.getContext(); console.log('TEST-STATE t=' + t + ' run=' + st.S.run + ' phase=' + st.S.phase + ' view=' + st.S.view + ' ok=' + V.ok + ' lost=' + (gl && gl.isContextLost()) + ' dist=' + V.dist + ' atoms=' + st.S.atomsVisible + ' dirty=' + V.dirty + ' canvas=' + (V.renderer && V.renderer.domElement.width + 'x' + V.renderer.domElement.height)); }, t));
    window.addEventListener('error', (e) => console.error('TEST-ERR ' + e.message + ' @' + e.lineno));
})();
</script>
